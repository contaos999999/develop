name: ContaOS Domínios Restantes HML
on:
  pull_request:
    paths:
      - 'supabase/tests/p0_crud_global_remaining*'
      - 'supabase/tests/remaining_domains/**'
      - '.github/workflows/p0-crud-remaining-hml.yml'
  workflow_dispatch:
    inputs:
      tested_head:
        description: Exact live main HEAD after approved deployment
        required: true
        type: string
      restore_run_id:
        description: Successful push main Restore run for this HEAD
        required: true
        type: string
      deploy_receipt_comment_id:
        description: Verified source readback receipt in GATE 138
        required: true
        type: string
  workflow_run:
    workflows: ['ContaOS Restore Isolado']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: contaos-remaining-domains-${{ github.event_name }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  scope:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      applicable: ${{ steps.route.outputs.applicable }}
      domains: ${{ steps.route.outputs.domains }}
      tested_head: ${{ steps.route.outputs.tested_head }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read-only exact task routing
        id: route
        env:
          REQUESTED_HEAD: ${{ inputs.tested_head }}
          RESTORE_RUN_ID: ${{ inputs.restore_run_id || github.event.workflow_run.id }}
          DEPLOY_RECEIPT_COMMENT_ID: ${{ inputs.deploy_receipt_comment_id }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys,re,subprocess
          task=json.loads(pathlib.Path('docs/tasks/active-task.json').read_text())
          assert isinstance(task.get('id'),str) and isinstance(task.get('phase'),str)
          applicable=(task['id'],task['phase'])==('P0-CRUD-GLOBAL-HML-20261107','BUILD_CERTIFICACAO_DOMINIOS_RESTANTES')
          domains=[]
          if applicable:
              sys.path.insert(0,'supabase/tests')
              from p0_crud_global_remaining_hml import selected_domains,assert_preserved
              from remaining_domains.ai_deploy_gate import runtime_route
              applicable=runtime_route(task,os.environ['GITHUB_EVENT_NAME'])
              if os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch':
                  assert os.environ['GITHUB_REF']=='refs/heads/main'
                  assert os.environ['REQUESTED_HEAD']==os.environ['GITHUB_SHA']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
                  assert re.fullmatch('[1-9][0-9]{1,20}',os.environ['RESTORE_RUN_ID']) and re.fullmatch('[1-9][0-9]{1,20}',os.environ['DEPLOY_RECEIPT_COMMENT_ID'])
              if applicable:domains=selected_domains(task);assert_preserved(pathlib.Path('.'),task)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('applicable='+str(applicable).lower()+'\n'+'domains='+json.dumps(domains)+'\n'+'tested_head='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()+'\n')
          print('APPLICABLE_OWN_DOMAINS' if applicable else 'NOT_APPLICABLE_NO_HML_ACCESS')
          PY
  runtime-ready:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      actions: read
      issues: read
    outputs:
      receipt_comment_id: ${{ steps.ready.outputs.receipt_comment_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.scope.outputs.tested_head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact HEAD and independently verified deployment before HML environment
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_HEAD: ${{ needs.scope.outputs.tested_head }}
          RESTORE_RUN_ID: ${{ inputs.restore_run_id || github.event.workflow_run.id }}
          DEPLOY_RECEIPT_COMMENT_ID: ${{ inputs.deploy_receipt_comment_id }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess,sys,urllib.parse
          sys.path.insert(0,'supabase/tests')
          from remaining_domains.ai_deploy_gate import find_deployment_receipt,verify_ci_binding
          task=json.loads(pathlib.Path('docs/tasks/active-task.json').read_text())
          sha=os.environ['TESTED_HEAD']
          assert re.fullmatch('[0-9a-f]{40}',sha) and subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==sha
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/contaos999999/develop/'+path],text=True))
          assert api('commits/main')['sha']==sha,'Live HEAD changed before deployment readiness'
          checks=api('commits/'+sha+'/check-runs?per_page=100')['check_runs']
          for name in ['guard','reconstruir-banco-do-zero','prova-backup-dados-sinteticos-duas-instancias']:
              assert any(c['name']==name and c['head_sha']==sha and c['conclusion']=='success' for c in checks),name
          comment_id=''
          if task.get('remaining_certification',{}).get('approved_ai_worker_deploy') or task.get('remaining_certification',{}).get('approved_ai_worker_runtime'):
              run=os.environ['RESTORE_RUN_ID'];assert re.fullmatch('[1-9][0-9]{1,20}',run)
              restore=api('actions/runs/'+run)
              not_before=verify_ci_binding(restore,checks,sha)
              given=os.environ.get('DEPLOY_RECEIPT_COMMENT_ID','')
              if given:
                  assert re.fullmatch('[1-9][0-9]{1,20}',given)
                  comments=[api('issues/comments/'+given)]
              else:
                  comments=api('issues/138/comments?per_page=100&since='+urllib.parse.quote(restore['created_at'],safe=''))
              origin=None
              runtime=task['remaining_certification'].get('approved_ai_worker_runtime')
              if runtime:
                  origin_id=runtime['origin_receipt_comment_id'];assert type(origin_id) is int and origin_id>0
                  origin=api('issues/comments/'+str(origin_id))
              comment_id,_=find_deployment_receipt(task,sha,comments,not_before=not_before,origin_comment=origin)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('receipt_comment_id='+str(comment_id)+'\n')
          print('RUNTIME_DEPLOYMENT_READY_NO_HML_CREDENTIALS')
          PY
  public-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Prepare public probe paths and exact frontend
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re
          t=json.loads(pathlib.Path('docs/tasks/active-task.json').read_text());sha=t['crud_global_proof']['frontend_head']
          assert re.fullmatch('[0-9a-f]{40}',sha)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('FRONTEND_HEAD='+sha+'\nTESTED_HEAD='+os.environ['GITHUB_SHA']+'\nCONTAOS_TEST_PRIVATE_DIR='+os.environ['RUNNER_TEMP']+'/contaos-public-probe-private\nCONTAOS_FRONTEND_DIR='+os.environ['RUNNER_TEMP']+'/contaos-public-probe-frontend\n')
          PY
      - name: Exact public frontend and isolated dependencies
        run: |
          git init "$CONTAOS_FRONTEND_DIR"
          git -C "$CONTAOS_FRONTEND_DIR" remote add origin https://github.com/contaos999999/contaos-hml-control.git
          git -C "$CONTAOS_FRONTEND_DIR" fetch --depth=1 origin "$FRONTEND_HEAD"
          git -C "$CONTAOS_FRONTEND_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$CONTAOS_FRONTEND_DIR" rev-parse HEAD)" = "$FRONTEND_HEAD"
          cd "$CONTAOS_FRONTEND_DIR"
          bun install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/contaos-public-probe-deps" --no-save --no-package-lock --ignore-scripts playwright@1.64.1
          "$RUNNER_TEMP/contaos-public-probe-deps/node_modules/.bin/playwright" install --with-deps chromium
          echo "CONTAOS_PLAYWRIGHT_MODULE=$RUNNER_TEMP/contaos-public-probe-deps/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Public interaction only - no HML environment or Auth fixtures
        run: env -u DATABASE_URL -u AUTH_ADMIN_KEY -u GH_TOKEN node supabase/tests/p0_crud_global_browser.mjs --public-probe
      - name: Public diagnostic artifact only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contaos-crud-global-public-interactivity-only
          path: ${{ runner.temp }}/contaos-public-probe-private/public-browser/
          if-no-files-found: error
          retention-days: 30
      - name: Erase own public probe files
        if: always()
        run: rm -rf -- "$CONTAOS_TEST_PRIVATE_DIR" "$CONTAOS_FRONTEND_DIR"
  domain-proof:
    needs: [scope, runtime-ready]
    if: needs.scope.result == 'success' && needs.scope.outputs.applicable == 'true' && needs.runtime-ready.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJSON(needs.scope.outputs.domains) }}
    runs-on: ubuntu-latest
    environment: hml
    timeout-minutes: ${{ matrix.domain == 'apresentacao' && 55 || 20 }}
    permissions:
      contents: read
      checks: read
      actions: read
      issues: read
    env:
      TESTED_HEAD: ${{ needs.scope.outputs.tested_head }}
      FRONTEND_HEAD: 164b10b44eaf5b553efcc7ab4e053b86c4d3b269
      DOMAIN: ${{ matrix.domain }}
      RESTORE_RUN_ID: ${{ inputs.restore_run_id || github.event.workflow_run.id }}
      DEPLOY_RECEIPT_COMMENT_ID: ${{ needs.runtime-ready.outputs.receipt_comment_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.scope.outputs.tested_head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned official CLI for single approved detail migration
        if: matrix.domain == 'documento_detalhe'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.122.0
      - name: Exact live HEAD and immutable proof before HML credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess,sys
          sys.path.insert(0,'supabase/tests')
          from p0_crud_global_remaining_hml import selected_domains,assert_preserved
          task=json.loads(pathlib.Path('docs/tasks/active-task.json').read_text())
          assert os.environ['DOMAIN'] in selected_domains(task)
          assert_preserved(pathlib.Path('.'),task)
          sha=os.environ['TESTED_HEAD']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==sha
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/contaos999999/develop/'+path],text=True))
          assert api('commits/main')['sha']==sha,'Live HEAD changed'
          checks=api('commits/'+sha+'/check-runs?per_page=100')['check_runs']
          for name in ['guard','reconstruir-banco-do-zero','prova-backup-dados-sinteticos-duas-instancias']:
              assert any(c['name']==name and c['head_sha']==sha and c['conclusion']=='success' for c in checks),name
          private=pathlib.Path(os.environ['RUNNER_TEMP'])/('contaos-remaining-'+os.environ['DOMAIN'])
          if task.get('remaining_certification',{}).get('approved_ai_worker_deploy') or task.get('remaining_certification',{}).get('approved_ai_worker_runtime'):
              import re
              from remaining_domains.ai_deploy_gate import validate_receipt,verify_ci_binding
              comment_id=os.environ['DEPLOY_RECEIPT_COMMENT_ID'];assert re.fullmatch('[1-9][0-9]{1,20}',comment_id)
              comment=api('issues/comments/'+comment_id)
              assert comment['user']['login']=='contaos9999'
              assert comment['issue_url']=='https://api.github.com/repos/contaos999999/develop/issues/138'
              restore=api('actions/runs/'+os.environ['RESTORE_RUN_ID'])
              not_before=verify_ci_binding(restore,checks,sha)
              origin=None
              runtime=task['remaining_certification'].get('approved_ai_worker_runtime')
              if runtime:
                  origin_id=runtime['origin_receipt_comment_id'];assert type(origin_id) is int and origin_id>0
                  origin=api('issues/comments/'+str(origin_id))
              receipt=validate_receipt(task,sha,json.loads(comment['body']),not_before=not_before,comment_created_at=comment['created_at'],origin_comment=origin)
              private.mkdir(mode=0o700,parents=True,exist_ok=True)
              path=private/'ai-deploy-receipt.json';path.write_text(json.dumps(receipt,indent=2)+'\n');path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('CONTAOS_TEST_PRIVATE_DIR='+str(private)+'\n')
          print('HEAD_MANIFEST_PRESERVED_PROOF_CHECKS_SUCCESS')
          PY
      - name: Complete migration parity and real own JWT domain proof
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_URL: ${{ secrets.CONTAOS_HML_DATABASE_URL }}
          AUTH_ADMIN_KEY: ${{ secrets.CONTAOS_HML_AUTH_ADMIN_KEY || secrets.CONTAOS_HML_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess,urllib.parse
          sha=os.environ['TESTED_HEAD']
          live=json.loads(subprocess.check_output(['gh','api','repos/contaos999999/develop/commits/main'],text=True))
          assert live['sha']==sha,'Live HEAD changed before Auth'
          url=urllib.parse.urlsplit(os.environ['DATABASE_URL'])
          assert url.username=='postgres.gklhhhyosgasnyoxlrui' and url.hostname.endswith('.pooler.supabase.com')
          task=json.loads(pathlib.Path('docs/tasks/active-task.json').read_text())
          if task.get('remaining_certification',{}).get('approved_hml_migration'):
              import sys
              sys.path.insert(0,'supabase/tests')
              version=task['remaining_certification']['approved_hml_migration']['version']
              if version=='20261108183000':
                  from remaining_domains.detail_migration import ensure_migration
              elif version=='20261108184219':
                  from remaining_domains.metadata_migration import ensure_migration
              else:
                  raise AssertionError('Unreviewed migration dispatcher version')
              ensure_migration(os.environ)
          local=sorted(p.name.split('_',1)[0] for p in pathlib.Path('supabase/migrations').glob('*.sql'))
          remote=subprocess.run(['psql',os.environ['DATABASE_URL'],'-X','-qAt','-v','ON_ERROR_STOP=1','-c','select version from supabase_migrations.schema_migrations order by version'],capture_output=True,text=True)
          assert remote.returncode==0 and local==remote.stdout.splitlines() and len(local)==len(set(local))
          print('MIGRATION_VERSION_PARITY_EXACT',len(local))
          import sys
          sys.path.insert(0,'supabase/tests')
          from remaining_domains.catalog_parity import prove
          prove(os.environ)
          PY
          unset GH_TOKEN
          python3 supabase/tests/p0_crud_global_remaining_hml.py --domain "$DOMAIN"
      - name: Independent own quarantine and cleanup receipt
        if: always() && env.CONTAOS_TEST_PRIVATE_DIR != ''
        env:
          DATABASE_URL: ${{ secrets.CONTAOS_HML_DATABASE_URL }}
          AUTH_ADMIN_KEY: ${{ secrets.CONTAOS_HML_AUTH_ADMIN_KEY || secrets.CONTAOS_HML_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 supabase/tests/p0_crud_global_remaining_hml.py --domain "$DOMAIN" --cleanup
      - name: Sanitized independent domain receipts only
        if: always() && env.CONTAOS_TEST_PRIVATE_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contaos-remaining-${{ matrix.domain }}-sanitized
          path: |
            ${{ env.CONTAOS_TEST_PRIVATE_DIR }}/report.json
            ${{ env.CONTAOS_TEST_PRIVATE_DIR }}/cleanup.json
            ${{ env.CONTAOS_TEST_PRIVATE_DIR }}/catalog-parity-receipt.json
            ${{ env.CONTAOS_TEST_PRIVATE_DIR }}/ai-deploy-receipt.json
            ${{ env.CONTAOS_TEST_PRIVATE_DIR }}/migration-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Erase only own private runner files
        if: always() && env.CONTAOS_TEST_PRIVATE_DIR != ''
        run: rm -rf -- "$CONTAOS_TEST_PRIVATE_DIR"
