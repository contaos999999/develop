name: ContaOS P0 Actions Native CODE Request
on:
  push:
    branches: [main]
    paths:
      - 'docs/executor/requests/**'
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: p0-actions-native-code-request
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate provenance and produce local CODE receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/p0-actions-transport.mjs --collect
      - name: Preserve sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-actions-native-code-receipt
          path: ${{ runner.temp }}/p0-actions-canary/
          if-no-files-found: error
          retention-days: 30
