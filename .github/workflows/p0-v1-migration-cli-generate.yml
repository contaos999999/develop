name: P0 V1 migration CLI generator (HML only, no DB)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Supabase CLI and generate migration offline
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.81.3 --version
          npx --yes supabase@2.81.3 migration new --help >/dev/null
          npx --yes supabase@2.81.3 migration new p0_v1_master_rls_defense
          find supabase/migrations -maxdepth 1 -name '*_p0_v1_master_rls_defense.sql' -type f -print | tee "$RUNNER_TEMP/generated-path.txt"
          test "$(wc -l < "$RUNNER_TEMP/generated-path.txt")" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: p0-v1-master-rls-cli-generated
          path: |
            supabase/migrations/*_p0_v1_master_rls_defense.sql
          if-no-files-found: error
          retention-days: 7
