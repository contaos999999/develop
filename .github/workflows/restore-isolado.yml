name: ContaOS Restore Isolado

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/tests/hml_acceptance.sql'
      - 'supabase/tests/workflow_bopla.sql'
      - 'supabase/tests/alert_task_bopla.sql'
      - '.github/workflows/restore-isolado.yml'

permissions:
  contents: read

jobs:
  restore:
    name: reconstruir-banco-do-zero
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Supabase CLI fixada
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.122.0

      - name: Registrar versão da CLI
        run: supabase --version

      - name: Iniciar PostgreSQL Supabase isolado
        run: supabase db start

      - name: Recriar banco a partir das migrations versionadas
        run: supabase db reset --local --no-seed

      - name: Executar suítes oficiais de aceitação no banco reconstruído
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restore-proof
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'

          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/hml_acceptance.sql | tee restore-proof/hml-acceptance.txt
          if grep -Eq '\|f\|' restore-proof/hml-acceptance.txt; then
            echo 'A suíte HML contém teste com passou=false.'
            exit 1
          fi

          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/workflow_bopla.sql | tee restore-proof/workflow-bopla.txt
          if grep -Eq '\|f\|' restore-proof/workflow-bopla.txt; then
            echo 'A suíte de segurança de workflow contém teste com passou=false.'
            exit 1
          fi

          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/alert_task_bopla.sql | tee restore-proof/alert-task-bopla.txt
          if grep -Eq '\|f\|' restore-proof/alert-task-bopla.txt; then
            echo 'A suíte de segurança de tarefa de alerta contém teste com passou=false.'
            exit 1
          fi

          echo 'Suítes oficiais HML e de segurança BOPLA: PASS.'

      - name: Registrar histórico reconstruído
        shell: bash
        run: |
          mkdir -p restore-proof
          supabase migration list --local | tee restore-proof/migration-list.txt
          printf 'commit=%s\n' "${GITHUB_SHA}" > restore-proof/resultado.txt
          printf 'status=PASS\n' >> restore-proof/resultado.txt
          printf 'criterio=db reset local + suites HML/BOPLA concluídas sem erro\n' >> restore-proof/resultado.txt
          printf 'cli=2.122.0\n' >> restore-proof/resultado.txt
          printf 'postgres_major=17\n' >> restore-proof/resultado.txt

      - name: Publicar evidência do teste de restauração
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contaos-hml-restore-proof
          path: restore-proof/
          if-no-files-found: error
          retention-days: 30
