name: ContaOS Restore Isolado

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/tests/copilot_hml.mjs'
      - 'supabase/functions/copilot-query/index.ts'
      - 'supabase/tests/copilot_openai_contract.test.mjs'
      - '.github/workflows/copilot-hml.yml'
      - 'supabase/tests/worker_api_boundary*'
      - 'supabase/tests/worker_client_privileges*'
      - 'supabase/migrations/**'
      - 'supabase/tests/p0_crud_cadastros*'
      - 'supabase/tests/p0_crud_listas*'
      - 'supabase/tests/p0_crud_global*'
      - 'supabase/tests/remaining_domains/**'
      - '.github/workflows/p0-crud-remaining-hml.yml'
      - '.github/workflows/p0-crud-global-browser-hml.yml'
      - 'supabase/tests/p0_workflow_routing.test.mjs'
      - '.github/workflows/p0-v117-revisao-hml.yml'
      - '.github/workflows/p0-v117-browser-hml.yml'
      - 'supabase/tests/p0_v117_revisao*'
      - 'supabase/tests/history_catalog_compare.py'
      - 'supabase/tests/rbac_matrix.sql'
      - '.github/workflows/restore-isolado.yml'
      - '.github/workflows/p0-crud-cadastros-hml.yml'
      - '.github/workflows/p0-crud-listas-hml.yml'
      - '.github/workflows/p0-hml-migration-version-parity.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/tests/copilot_hml.mjs'
      - 'supabase/functions/copilot-query/index.ts'
      - 'supabase/tests/copilot_openai_contract.test.mjs'
      - '.github/workflows/copilot-hml.yml'
      - 'supabase/tests/worker_api_boundary*'
      - 'supabase/tests/worker_client_privileges*'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/tests/p0_crud_cadastros*'
      - 'supabase/tests/p0_crud_listas*'
      - 'supabase/tests/p0_crud_global*'
      - 'supabase/tests/remaining_domains/**'
      - '.github/workflows/p0-crud-remaining-hml.yml'
      - '.github/workflows/p0-crud-global-browser-hml.yml'
      - 'supabase/tests/p0_workflow_routing.test.mjs'
      - '.github/workflows/p0-v117-revisao-hml.yml'
      - '.github/workflows/p0-v117-browser-hml.yml'
      - 'supabase/tests/p0_v117_revisao*'
      - 'supabase/tests/history_catalog_compare.py'
      - 'supabase/tests/hml_acceptance.sql'
      - 'supabase/tests/workflow_bopla.sql'
      - 'supabase/tests/alert_task_bopla.sql'
      - 'supabase/tests/user_membership_authz.sql'
      - 'supabase/tests/contract_scope_bola.sql'
      - 'supabase/tests/webhook_rpc_auth.sql'
      - 'supabase/tests/sql_injection_regression.sql'
      - 'supabase/tests/reanalysis_authz.sql'
      - 'supabase/tests/v107_base_normativa.sql'
      - 'supabase/tests/v107_concurrency.sh'
      - '.github/workflows/restore-isolado.yml'
      - '.github/workflows/p0-crud-cadastros-hml.yml'
      - '.github/workflows/p0-crud-listas-hml.yml'
      - '.github/workflows/p0-hml-migration-version-parity.yml'

permissions:
  contents: read

jobs:
  restore:
    name: reconstruir-banco-do-zero
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Workflow routing contract without HML access
        run: node --test supabase/tests/p0_workflow_routing.test.mjs

      - name: Protocolo CRUD global sem rede ou credenciais
        run: node --test supabase/tests/p0_crud_global_protocol.test.mjs supabase/tests/worker_api_boundary.test.mjs supabase/tests/p0_crud_global_remaining.test.mjs supabase/tests/remaining_domains/detail_wrapper.test.mjs supabase/tests/remaining_domains/metadata_append.test.mjs supabase/tests/remaining_domains/presentation_source.test.mjs supabase/tests/remaining_domains/ai_envelope.test.mjs supabase/tests/remaining_domains/void_approval.test.mjs supabase/tests/copilot_catalog.test.mjs supabase/tests/copilot_openai_contract.test.mjs

      - name: Trilha C runner self-tests
        run: node supabase/tests/copilot_hml.mjs --self-test

      - name: Protocolo privado V117 sem rede
        run: |
          node supabase/tests/p0_v117_revisao_browser.mjs --self-test
          python3 -m py_compile supabase/tests/p0_v117_revisao_jwt.py
      - name: Instalar Supabase CLI fixada pelo pacote oficial
        shell: bash
        run: |
          set -euo pipefail
          CLI_ROOT="$RUNNER_TEMP/contaos-cli-pinned"
          npm install --prefix "$CLI_ROOT" --no-save --no-package-lock --ignore-scripts supabase@2.122.0
          test "$("$CLI_ROOT/node_modules/.bin/supabase" --version)" = '2.122.0'
          echo "$CLI_ROOT/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Registrar versão da CLI
        run: test "$(supabase --version)" = '2.122.0'

      - name: Preparar evidências
        run: mkdir -p restore-proof

      - name: Iniciar PostgreSQL Supabase isolado
        run: bash scripts/isolated-db-network.sh run db start

      - name: Recriar banco a partir das migrations versionadas
        run: bash scripts/isolated-db-network.sh run db reset --local --no-seed

      - name: Export exact application catalog without user rows
        shell: bash
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          test "$DB_URL" = postgresql://postgres:postgres@127.0.0.1:54322/postgres
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c 'begin read only;' -f supabase/tests/remaining_domains/catalog_parity.sql -c 'commit;' > restore-proof/catalog-parity.json
          python3 -m json.tool restore-proof/catalog-parity.json > /dev/null
          printf '%s\n' "$GITHUB_SHA" > restore-proof/catalog-parity-head.txt

      - name: Worker client privilege catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,os,subprocess
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('boundary','supabase/tests/worker_api_boundary_hml.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          try:
            result=subprocess.run(['psql','postgresql://postgres:postgres@127.0.0.1:54322/postgres','-X','-qAt','-v','ON_ERROR_STOP=1'],input='BEGIN READ ONLY;'+module.client_attack_surface_sql()+';ROLLBACK;',text=True,capture_output=True,timeout=20)
            passed=result.returncode==0 and result.stdout.strip()=='t'
          except (OSError,subprocess.TimeoutExpired):
            passed=False
          Path('restore-proof/worker-client-privileges.json').write_text(json.dumps({'state':'PASS' if passed else 'FAIL','head':os.environ['GITHUB_SHA'],'catalog_only':True})+'\n')
          print('WORKER_CLIENT_PRIVILEGES_'+('PASS' if passed else 'FAIL'))
          if not passed:raise SystemExit(1)
          PY

      - name: Teste 1 - Aceitação HML
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/hml_acceptance.sql | tee restore-proof/hml-acceptance.txt
          if grep -Eq '\|f\|' restore-proof/hml-acceptance.txt; then
            echo 'A suíte HML contém teste com passou=false.'
            exit 1
          fi

      - name: Teste 2 - Workflow BOPLA
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/workflow_bopla.sql | tee restore-proof/workflow-bopla.txt
          if grep -Eq '\|f\|' restore-proof/workflow-bopla.txt; then
            echo 'A suíte de segurança de workflow contém teste com passou=false.'
            exit 1
          fi

      - name: Teste 3 - Tarefa de alerta BOPLA
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/alert_task_bopla.sql | tee restore-proof/alert-task-bopla.txt
          if grep -Eq '\|f\|' restore-proof/alert-task-bopla.txt; then
            echo 'A suíte de segurança de tarefa de alerta contém teste com passou=false.'
            exit 1
          fi

      - name: Teste 4 - Autorização de vínculos
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/user_membership_authz.sql | tee restore-proof/user-membership-authz.txt
          if grep -Eq '\|f\|' restore-proof/user-membership-authz.txt; then
            echo 'A suíte de autorização de vínculos contém teste com passou=false.'
            exit 1
          fi

      - name: Teste 5 - BOLA entre contratos
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/contract_scope_bola.sql | tee restore-proof/contract-scope-bola.txt
          if grep -Eq '\|f\|' restore-proof/contract-scope-bola.txt; then
            echo 'A suíte BOLA entre contratos contém teste com passou=false.'
            exit 1
          fi

      - name: Teste 6 - Autorização da RPC de webhook
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/webhook_rpc_auth.sql | tee restore-proof/webhook-rpc-auth.txt
          if grep -Eq '\|f\|' restore-proof/webhook-rpc-auth.txt; then
            echo 'A suíte de autorização da RPC de webhook contém teste com passou=false.'
            exit 1
          fi

      - name: Teste 7 - SQL Injection e variantes
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/sql_injection_regression.sql | tee restore-proof/sql-injection-regression.txt
          if grep -Eq '\|f\|' restore-proof/sql-injection-regression.txt; then
            echo 'A suíte de regressão contra SQL Injection contém teste com passou=false.'
            exit 1
          fi

      - name: Teste 8 - Autorização de reanálise e anti-enumeração
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/reanalysis_authz.sql | tee restore-proof/reanalysis-authz.txt
          if grep -Eq '\|f\|' restore-proof/reanalysis-authz.txt; then
            echo 'A suíte de autorização de reanálise contém teste com passou=false.'
            exit 1
          fi

      - name: Teste 9 - Backend normativo V1-07
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/v107_base_normativa.sql | tee restore-proof/v107-base-normativa.txt
          if ! grep -Fxq '32|32' restore-proof/v107-base-normativa.txt; then
            echo 'A suíte V107 não concluiu 32/32.'
            exit 1
          fi

      - name: Teste 10 - Concorrência real V1-07
        shell: bash
        run: |
          set -euo pipefail
          export DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          bash supabase/tests/v107_concurrency.sh | tee restore-proof/v107-concurrency.txt

      - name: Teste 11 - Concorrência real V1-17
        shell: bash
        run: |
          set -euo pipefail
          export DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          bash supabase/tests/v117_reanalysis_concurrency.sh | tee restore-proof/v117-concurrency.txt

      - name: Compare historical HML metadata after source recovery
        shell: bash
        run: |
          set -euo pipefail
          export DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          python3 supabase/tests/history_catalog_compare.py | tee restore-proof/history-catalog.txt
          grep -Fq 'HISTORY_CATALOG_PASS' restore-proof/history-catalog.txt

      - name: Trilha C - RAG elegível e quota SQL isolada
        shell: bash
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -At -v ON_ERROR_STOP=1 -f supabase/tests/copilot_scope_quota.sql | tee restore-proof/copilot-scope-quota.txt
          grep -Fxq 'COPILOT_SCOPE_QUOTA_SQL_PASS' restore-proof/copilot-scope-quota.txt
          python3 - <<'PY' | tee restore-proof/copilot-quota-concurrency.txt
          import concurrent.futures,json,os,subprocess,time,uuid
          DB='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          ORG='c7171717-aaaa-4000-8000-000000000001';CT='c7171717-2000-4000-8000-000000000001';U='c7171717-0000-4000-8000-000000000001';SID='c7171717-0000-4000-9000-000000000001'
          PREFIX='copilot-concurrency-'+uuid.uuid4().hex
          race_session=None
          F=json.dumps({'session_id':SID,'ids_fragmentos':[],'ids_precedentes':[]})
          def sql(q):
           r=subprocess.run(['psql',DB,'-X','-qAt','-v','ON_ERROR_STOP=1'],input=q,text=True,capture_output=True,timeout=30)
           assert r.returncode==0,'COPILOT_CONCURRENCY_SQL_FAILED'
           return r.stdout.strip()
          def reserve(n):
           return json.loads(sql("select public.worker_reservar_consulta_copiloto('%s','%s','%s','%s','%s'::jsonb,'isolated');"%(ORG,CT,U,PREFIX+str(n),F)))
          try:
           first=reserve(0);assert first['autorizado']
           # A terceira conexão segura exatamente a trava usada pela reserva, antes da disputa.
           lock="begin;select pg_advisory_xact_lock(hashtextextended('copilot:org:%s',0));select pg_sleep(1);commit;"%ORG
           holder=subprocess.Popen(['psql',DB,'-X','-qAt','-v','ON_ERROR_STOP=1'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
           holder.stdin.write(lock);holder.stdin.close();assert holder.stdout.readline()=='\n'
           started=time.monotonic()
           with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:results=list(pool.map(reserve,[1,2]))
           assert time.monotonic()-started>=0.4,'Native lock not exercised'
           assert holder.wait(timeout=15)==0
           assert sum(r['autorizado'] for r in results)==1
           assert [r['codigo'] for r in results if not r['autorizado']]==['COPILOTO_LIMITE_CONCORRENCIA']
           live=next(r for r in results if r['autorizado']);before=sql("select criado_em from public.consultas_semanticas where id='%s';"%first['id_consulta'])
           sql("update public.consultas_semanticas set filtros=jsonb_set(jsonb_set(filtros,'{copilot,expires_at}',to_jsonb(clock_timestamp()-interval '1 second')),'{copilot,deadline_at}',to_jsonb(clock_timestamp()-interval '1 second')) where id='%s';"%first['id_consulta'])
           recovered=reserve(3);assert recovered['autorizado']
           assert sql("select status||':'||(filtros#>>'{copilot,erro}') from public.consultas_semanticas where id='%s';"%first['id_consulta'])=='falhou:LEASE_EXPIRADA'
           assert sql("select criado_em from public.consultas_semanticas where id='%s';"%first['id_consulta'])==before
           assert sql("select public.worker_validar_lease_copiloto('%s','%s');"%(first['id_consulta'],first['token']))=='f'
           assert sql("select public.worker_validar_lease_copiloto('%s','%s');"%(live['id_consulta'],live['token']))=='t'
           assert sql("select position('%s' in filtros::text)=0 from public.consultas_semanticas where id='%s';"%(live['token'],live['id_consulta']))=='t'
           # Expirar somente deadline impede conclusão, mas não libera slot antes da lease.
           sql("update public.consultas_semanticas set filtros=jsonb_set(filtros,'{copilot,deadline_at}',to_jsonb(clock_timestamp()-interval '1 second')) where id='%s';"%recovered['id_consulta'])
           assert sql("select public.worker_validar_lease_copiloto('%s','%s');"%(recovered['id_consulta'],recovered['token']))=='f'
           assert reserve(4)['codigo']=='COPILOTO_LIMITE_CONCORRENCIA'
           assert sql("select count(*) from public.consultas_semanticas where texto_consulta like '%s%%';"%PREFIX)=='3'
           # Native recovery versus completion: both clients contend on the same expired row.
           for active in [live,recovered]:sql("select public.worker_falhar_consulta_copiloto('%s','%s','PRAZO_ESGOTADO');"%(active['id_consulta'],active['token']))
           race_session=str(uuid.uuid4());sql("insert into public.sessoes_copiloto(id,id_organizacao,id_contrato,criado_por) values('%s','%s','%s','%s');"%(race_session,ORG,CT,U))
           race=reserve(5)
           sql("update public.consultas_semanticas set filtros=jsonb_set(jsonb_set(filtros,'{copilot,expires_at}',to_jsonb(clock_timestamp()-interval '1 second')),'{copilot,deadline_at}',to_jsonb(clock_timestamp()-interval '1 second')) where id='%s';"%race['id_consulta'])
           lock="begin;select id from public.consultas_semanticas where id='%s' for update;select pg_sleep(1);commit;"%race['id_consulta']
           holder=subprocess.Popen(['psql',DB,'-X','-qAt','-v','ON_ERROR_STOP=1'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
           holder.stdin.write(lock);holder.stdin.close();assert holder.stdout.readline().strip()==race['id_consulta']
           def finish_probe():
            q="\\set VERBOSITY sqlstate\nselect public.worker_concluir_consulta_copiloto('%s','%s','%s','{\"provedor\":\"supabase\",\"conteudo\":\"Expired executor\"}','[]');"%(race['id_consulta'],race['token'],race_session)
            result=subprocess.run(['psql',DB,'-X','-qAt','-v','ON_ERROR_STOP=1'],input=q,text=True,capture_output=True,timeout=30)
            return result.returncode!=0 and 'PT409' in result.stderr
           started=time.monotonic()
           with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
            recovery=pool.submit(reserve,6);completion=pool.submit(finish_probe)
            assert recovery.result()['autorizado'] and completion.result()
           assert time.monotonic()-started>=0.4 and holder.wait(timeout=15)==0
           assert sql("select status from public.consultas_semanticas where id='%s';"%race['id_consulta'])=='falhou'
           assert sql("select count(*) from public.retornos_modelo where id_consulta='%s';"%race['id_consulta'])=='0'
           assert sql("select count(*) from public.mensagens_copiloto where id_consulta_semantica='%s';"%race['id_consulta'])=='0'
           print('COPILOT_QUOTA_CONCURRENCY_PASS: native two-client contention; 2 active; expired orphan fenced; live lease retained; recovery-completion race fenced; no raw token stored')
          finally:
           sql("delete from public.fontes_resposta_copiloto where id_mensagem in(select m.id from public.mensagens_copiloto m join public.consultas_semanticas q on q.id=m.id_consulta_semantica where q.texto_consulta like '%s%%' and q.criado_por='%s');"%(PREFIX,U))
           sql("delete from public.mensagens_copiloto where id_consulta_semantica in(select id from public.consultas_semanticas where texto_consulta like '%s%%' and criado_por='%s');"%(PREFIX,U))
           sql("delete from public.retornos_modelo where id_consulta in(select id from public.consultas_semanticas where texto_consulta like '%s%%' and criado_por='%s');"%(PREFIX,U))
           sql("delete from public.consultas_semanticas where texto_consulta like '%s%%' and id_organizacao='%s' and criado_por='%s';"%(PREFIX,ORG,U))
           assert sql("select count(*) from public.consultas_semanticas where texto_consulta like '%s%%';"%PREFIX)=='0'

           if race_session:sql("delete from public.sessoes_copiloto where id='%s' and criado_por='%s' and id_organizacao='%s';"%(race_session,U,ORG))
          PY
          grep -Fq 'COPILOT_QUOTA_CONCURRENCY_PASS:' restore-proof/copilot-quota-concurrency.txt

      - name: Teste 12 - Matriz RBAC V1
        shell: bash
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -At -v ON_ERROR_STOP=1 -f supabase/tests/rbac_matrix.sql | tee restore-proof/rbac-matrix.txt
          grep -Fxq 'RBAC_ISOLATED_PASS' restore-proof/rbac-matrix.txt

      - name: Teste 13 - Concorrência real RBAC
        shell: bash
        run: |
          set -euo pipefail
          export DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          python3 supabase/tests/rbac_concurrency.py | tee restore-proof/rbac-concurrency.txt
          grep -Fq 'RBAC_CONCURRENCY_PASS' restore-proof/rbac-concurrency.txt

      - name: Teste 14 - CRUD cadastros isolado
        shell: bash
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -At -v ON_ERROR_STOP=1 -f supabase/tests/p0_crud_cadastros.sql | tee restore-proof/crud-cadastros.txt
          grep -Fxq 'CRUD_CADASTROS_ISOLATED_PASS' restore-proof/crud-cadastros.txt

      - name: Teste 15 - CRUD listas isolado
        shell: bash
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -At -v ON_ERROR_STOP=1 -f supabase/tests/p0_crud_listas.sql | tee restore-proof/crud-listas.txt
          grep -Fxq 'CRUD_LISTAS_ISOLATED_PASS' restore-proof/crud-listas.txt

      - name: Teste 16 - Concorrência de lista e snapshot
        shell: bash
        run: |
          set -euo pipefail
          export DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          python3 supabase/tests/p0_crud_listas_concurrency.py | tee restore-proof/crud-listas-concurrency.txt
          grep -Fxq 'CRUD_LISTAS_CONCURRENCY_PASS' restore-proof/crud-listas-concurrency.txt

      - name: Teste 17 - Revisão humana V117
        shell: bash
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -At -v ON_ERROR_STOP=1 -f supabase/tests/p0_v117_revisao.sql | tee restore-proof/v117-revisao.txt
          grep -Fxq 'V117_REVISAO_ISOLATED_PASS' restore-proof/v117-revisao.txt

      - name: Teste 18 - Concorrência de revisão V117
        shell: bash
        run: |
          set -euo pipefail
          export DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          python3 supabase/tests/p0_v117_revisao_concurrency.py | tee restore-proof/v117-revisao-concurrency.txt
          grep -Fq 'V117_REVISAO_CONCURRENCY_PASS' restore-proof/v117-revisao-concurrency.txt

      - name: Teste 19 - Recuperação de fixtures Auth sem rede
        shell: bash
        env:
          CONTAOS_TEST_PRIVATE_DIR: ${{ runner.temp }}/v117-auth-recovery-test
          DATABASE_URL: postgresql://postgres.gklhhhyosgasnyoxlrui:placeholder@aws.pooler.supabase.com/postgres
        run: python3 supabase/tests/p0_v117_revisao_jwt.py --self-test

      - name: Teste 20 - Quarentena documental no banco local descartável
        shell: bash
        env:
          CONTAOS_LOCAL_QUARANTINE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          python3 supabase/tests/p0_crud_global_hml.py --local-document-quarantine-proof | tee restore-proof/document-quarantine-local.txt
          grep -Fxq 'DOCUMENT_QUARANTINE_LOCAL_SQL_PASS' restore-proof/document-quarantine-local.txt

      - name: Teste 21 - Vigencia documental delegada com RBAC preservado
        shell: bash
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          test "$DB_URL" = postgresql://postgres:postgres@127.0.0.1:54322/postgres
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f supabase/tests/remaining_domains/detail_wrapper_local.sql | tee restore-proof/detail-vigency-local.txt
          grep -Fxq 'DETAIL_VIGENCY_LOCAL_SQL_PASS' restore-proof/detail-vigency-local.txt

      - name: Teste 22 - Metadados revisados acrescentam versao imutavel
        shell: bash
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          test "$DB_URL" = postgresql://postgres:postgres@127.0.0.1:54322/postgres
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f supabase/tests/remaining_domains/metadata_append_local.sql | tee restore-proof/metadata-append-local.txt
          grep -Fxq 'METADATA_APPEND_LOCAL_SQL_PASS' restore-proof/metadata-append-local.txt

      - name: Teste 23 - Quarentena historica local com corrida real
        shell: bash
        env:
          CONTAOS_LOCAL_QUARANTINE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          PYTHONPATH=supabase/tests python3 supabase/tests/remaining_domains/history_quarantine_local.py | tee restore-proof/history-quarantine-local.txt
          grep -Fxq 'HISTORY_QUARANTINE_LOCAL_SQL_PASS' restore-proof/history-quarantine-local.txt

      - name: Registrar histórico reconstruído
        shell: bash
        run: |
          bash scripts/isolated-db-network.sh run migration list --local | tee restore-proof/migration-list.txt
          printf 'commit=%s\n' "${GITHUB_SHA}" > restore-proof/resultado.txt
          printf 'status=PASS\n' >> restore-proof/resultado.txt
          printf 'criterio=db reset local + suites HML/seguranca concluídas sem erro\n' >> restore-proof/resultado.txt
          printf 'cli=2.122.0\n' >> restore-proof/resultado.txt
          printf 'postgres_major=17\n' >> restore-proof/resultado.txt

      - name: Publicar evidência do teste de restauração
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contaos-hml-restore-proof
          path: restore-proof/
          if-no-files-found: warn
          retention-days: 30

  synthetic-data-restore:
    name: prova-backup-dados-sinteticos-duas-instancias
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar Supabase CLI fixada
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.122.0
      - name: Verificar CLI, shell e destino local exclusivo
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          bash -n scripts/p0-v1-synthetic-data-restore.sh
          test -f supabase/config.toml
      - name: Executar backup e restore local com instancias sequenciais e dados ficticios
        shell: bash
        run: bash scripts/p0-v1-synthetic-data-restore.sh
      - name: Arquivar apenas provas sanitizadas, jamais o arquivo dump
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contaos-p0-v1-synthetic-data-restore
          path: restore-proof-synthetic/
          if-no-files-found: warn
          retention-days: 30

