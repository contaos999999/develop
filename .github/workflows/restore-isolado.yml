name: ContaOS Restore Isolado

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/tests/worker_api_boundary*'
      - 'supabase/tests/worker_client_privileges*'
      - 'supabase/migrations/**'
      - 'supabase/tests/p0_crud_cadastros*'
      - 'supabase/tests/p0_crud_listas*'
      - 'supabase/tests/p0_crud_global*'
      - '.github/workflows/p0-crud-global-browser-hml.yml'
      - 'supabase/tests/p0_workflow_routing.test.mjs'
      - '.github/workflows/p0-v117-revisao-hml.yml'
      - '.github/workflows/p0-v117-browser-hml.yml'
      - 'supabase/tests/p0_v117_revisao*'
      - 'supabase/tests/history_catalog_compare.py'
      - 'supabase/tests/rbac_matrix.sql'
      - '.github/workflows/restore-isolado.yml'
      - '.github/workflows/p0-crud-cadastros-hml.yml'
      - '.github/workflows/p0-crud-listas-hml.yml'
      - '.github/workflows/p0-hml-migration-version-parity.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/tests/worker_api_boundary*'
      - 'supabase/tests/worker_client_privileges*'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/tests/p0_crud_cadastros*'
      - 'supabase/tests/p0_crud_listas*'
      - 'supabase/tests/p0_crud_global*'
      - '.github/workflows/p0-crud-global-browser-hml.yml'
      - 'supabase/tests/p0_workflow_routing.test.mjs'
      - '.github/workflows/p0-v117-revisao-hml.yml'
      - '.github/workflows/p0-v117-browser-hml.yml'
      - 'supabase/tests/p0_v117_revisao*'
      - 'supabase/tests/history_catalog_compare.py'
      - 'supabase/tests/hml_acceptance.sql'
      - 'supabase/tests/workflow_bopla.sql'
      - 'supabase/tests/alert_task_bopla.sql'
      - 'supabase/tests/user_membership_authz.sql'
      - 'supabase/tests/contract_scope_bola.sql'
      - 'supabase/tests/webhook_rpc_auth.sql'
      - 'supabase/tests/sql_injection_regression.sql'
      - 'supabase/tests/reanalysis_authz.sql'
      - 'supabase/tests/v107_base_normativa.sql'
      - 'supabase/tests/v107_concurrency.sh'
      - '.github/workflows/restore-isolado.yml'
      - '.github/workflows/p0-crud-cadastros-hml.yml'
      - '.github/workflows/p0-crud-listas-hml.yml'
      - '.github/workflows/p0-hml-migration-version-parity.yml'

permissions:
  contents: read

jobs:
  restore:
    name: reconstruir-banco-do-zero
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Workflow routing contract without HML access
        run: node --test supabase/tests/p0_workflow_routing.test.mjs

      - name: Protocolo CRUD global sem rede ou credenciais
        run: node --test supabase/tests/p0_crud_global_protocol.test.mjs supabase/tests/worker_api_boundary.test.mjs

      - name: Protocolo privado V117 sem rede
        run: |
          node supabase/tests/p0_v117_revisao_browser.mjs --self-test
          python3 -m py_compile supabase/tests/p0_v117_revisao_jwt.py
      - name: Instalar Supabase CLI fixada
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.122.0

      - name: Registrar versão da CLI
        run: supabase --version

      - name: Preparar evidências
        run: mkdir -p restore-proof

      - name: Iniciar PostgreSQL Supabase isolado
        run: bash scripts/isolated-db-network.sh run db start

      - name: Recriar banco a partir das migrations versionadas
        run: bash scripts/isolated-db-network.sh run db reset --local --no-seed

      - name: Worker client privilege catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,os,subprocess
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('boundary','supabase/tests/worker_api_boundary_hml.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          try:
            result=subprocess.run(['psql','postgresql://postgres:postgres@127.0.0.1:54322/postgres','-X','-qAt','-v','ON_ERROR_STOP=1'],input='BEGIN READ ONLY;'+module.client_attack_surface_sql()+';ROLLBACK;',text=True,capture_output=True,timeout=20)
            passed=result.returncode==0 and result.stdout.strip()=='t'
          except (OSError,subprocess.TimeoutExpired):
            passed=False
          Path('restore-proof/worker-client-privileges.json').write_text(json.dumps({'state':'PASS' if passed else 'FAIL','head':os.environ['GITHUB_SHA'],'catalog_only':True})+'\n')
          print('WORKER_CLIENT_PRIVILEGES_'+('PASS' if passed else 'FAIL'))
          if not passed:raise SystemExit(1)
          PY

      - name: Teste 1 - Aceitação HML
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/hml_acceptance.sql | tee restore-proof/hml-acceptance.txt
          if grep -Eq '\|f\|' restore-proof/hml-acceptance.txt; then
            echo 'A suíte HML contém teste com passou=false.'
            exit 1
          fi

      - name: Teste 2 - Workflow BOPLA
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/workflow_bopla.sql | tee restore-proof/workflow-bopla.txt
          if grep -Eq '\|f\|' restore-proof/workflow-bopla.txt; then
            echo 'A suíte de segurança de workflow contém teste com passou=false.'
            exit 1
          fi

      - name: Teste 3 - Tarefa de alerta BOPLA
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/alert_task_bopla.sql | tee restore-proof/alert-task-bopla.txt
          if grep -Eq '\|f\|' restore-proof/alert-task-bopla.txt; then
            echo 'A suíte de segurança de tarefa de alerta contém teste com passou=false.'
            exit 1
          fi

      - name: Teste 4 - Autorização de vínculos
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/user_membership_authz.sql | tee restore-proof/user-membership-authz.txt
          if grep -Eq '\|f\|' restore-proof/user-membership-authz.txt; then
            echo 'A suíte de autorização de vínculos contém teste com passou=false.'
            exit 1
          fi

      - name: Teste 5 - BOLA entre contratos
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/contract_scope_bola.sql | tee restore-proof/contract-scope-bola.txt
          if grep -Eq '\|f\|' restore-proof/contract-scope-bola.txt; then
            echo 'A suíte BOLA entre contratos contém teste com passou=false.'
            exit 1
          fi

      - name: Teste 6 - Autorização da RPC de webhook
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/webhook_rpc_auth.sql | tee restore-proof/webhook-rpc-auth.txt
          if grep -Eq '\|f\|' restore-proof/webhook-rpc-auth.txt; then
            echo 'A suíte de autorização da RPC de webhook contém teste com passou=false.'
            exit 1
          fi

      - name: Teste 7 - SQL Injection e variantes
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/sql_injection_regression.sql | tee restore-proof/sql-injection-regression.txt
          if grep -Eq '\|f\|' restore-proof/sql-injection-regression.txt; then
            echo 'A suíte de regressão contra SQL Injection contém teste com passou=false.'
            exit 1
          fi

      - name: Teste 8 - Autorização de reanálise e anti-enumeração
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/reanalysis_authz.sql | tee restore-proof/reanalysis-authz.txt
          if grep -Eq '\|f\|' restore-proof/reanalysis-authz.txt; then
            echo 'A suíte de autorização de reanálise contém teste com passou=false.'
            exit 1
          fi

      - name: Teste 9 - Backend normativo V1-07
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -f supabase/tests/v107_base_normativa.sql | tee restore-proof/v107-base-normativa.txt
          if ! grep -Fxq '32|32' restore-proof/v107-base-normativa.txt; then
            echo 'A suíte V107 não concluiu 32/32.'
            exit 1
          fi

      - name: Teste 10 - Concorrência real V1-07
        shell: bash
        run: |
          set -euo pipefail
          export DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          bash supabase/tests/v107_concurrency.sh | tee restore-proof/v107-concurrency.txt

      - name: Teste 11 - Concorrência real V1-17
        shell: bash
        run: |
          set -euo pipefail
          export DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          bash supabase/tests/v117_reanalysis_concurrency.sh | tee restore-proof/v117-concurrency.txt

      - name: Compare historical HML metadata after source recovery
        shell: bash
        run: |
          set -euo pipefail
          export DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          python3 supabase/tests/history_catalog_compare.py | tee restore-proof/history-catalog.txt
          grep -Fq 'HISTORY_CATALOG_PASS' restore-proof/history-catalog.txt

      - name: Teste 12 - Matriz RBAC V1
        shell: bash
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -At -v ON_ERROR_STOP=1 -f supabase/tests/rbac_matrix.sql | tee restore-proof/rbac-matrix.txt
          grep -Fxq 'RBAC_ISOLATED_PASS' restore-proof/rbac-matrix.txt

      - name: Teste 13 - Concorrência real RBAC
        shell: bash
        run: |
          set -euo pipefail
          export DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          python3 supabase/tests/rbac_concurrency.py | tee restore-proof/rbac-concurrency.txt
          grep -Fq 'RBAC_CONCURRENCY_PASS' restore-proof/rbac-concurrency.txt

      - name: Teste 14 - CRUD cadastros isolado
        shell: bash
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -At -v ON_ERROR_STOP=1 -f supabase/tests/p0_crud_cadastros.sql | tee restore-proof/crud-cadastros.txt
          grep -Fxq 'CRUD_CADASTROS_ISOLATED_PASS' restore-proof/crud-cadastros.txt

      - name: Teste 15 - CRUD listas isolado
        shell: bash
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -At -v ON_ERROR_STOP=1 -f supabase/tests/p0_crud_listas.sql | tee restore-proof/crud-listas.txt
          grep -Fxq 'CRUD_LISTAS_ISOLATED_PASS' restore-proof/crud-listas.txt

      - name: Teste 16 - Concorrência de lista e snapshot
        shell: bash
        run: |
          set -euo pipefail
          export DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          python3 supabase/tests/p0_crud_listas_concurrency.py | tee restore-proof/crud-listas-concurrency.txt
          grep -Fxq 'CRUD_LISTAS_CONCURRENCY_PASS' restore-proof/crud-listas-concurrency.txt

      - name: Teste 17 - Revisão humana V117
        shell: bash
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -At -v ON_ERROR_STOP=1 -f supabase/tests/p0_v117_revisao.sql | tee restore-proof/v117-revisao.txt
          grep -Fxq 'V117_REVISAO_ISOLATED_PASS' restore-proof/v117-revisao.txt

      - name: Teste 18 - Concorrência de revisão V117
        shell: bash
        run: |
          set -euo pipefail
          export DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          python3 supabase/tests/p0_v117_revisao_concurrency.py | tee restore-proof/v117-revisao-concurrency.txt
          grep -Fq 'V117_REVISAO_CONCURRENCY_PASS' restore-proof/v117-revisao-concurrency.txt

      - name: Teste 19 - Recuperação de fixtures Auth sem rede
        shell: bash
        env:
          CONTAOS_TEST_PRIVATE_DIR: ${{ runner.temp }}/v117-auth-recovery-test
          DATABASE_URL: postgresql://postgres.gklhhhyosgasnyoxlrui:placeholder@aws.pooler.supabase.com/postgres
        run: python3 supabase/tests/p0_v117_revisao_jwt.py --self-test

      - name: Teste 20 - Quarentena documental no banco local descartável
        shell: bash
        env:
          CONTAOS_LOCAL_QUARANTINE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          python3 supabase/tests/p0_crud_global_hml.py --local-document-quarantine-proof | tee restore-proof/document-quarantine-local.txt
          grep -Fxq 'DOCUMENT_QUARANTINE_LOCAL_SQL_PASS' restore-proof/document-quarantine-local.txt

      - name: Registrar histórico reconstruído
        shell: bash
        run: |
          bash scripts/isolated-db-network.sh run migration list --local | tee restore-proof/migration-list.txt
          printf 'commit=%s\n' "${GITHUB_SHA}" > restore-proof/resultado.txt
          printf 'status=PASS\n' >> restore-proof/resultado.txt
          printf 'criterio=db reset local + suites HML/seguranca concluídas sem erro\n' >> restore-proof/resultado.txt
          printf 'cli=2.122.0\n' >> restore-proof/resultado.txt
          printf 'postgres_major=17\n' >> restore-proof/resultado.txt

      - name: Publicar evidência do teste de restauração
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contaos-hml-restore-proof
          path: restore-proof/
          if-no-files-found: warn
          retention-days: 30

  synthetic-data-restore:
    name: prova-backup-dados-sinteticos-duas-instancias
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Instalar Supabase CLI fixada
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.122.0
      - name: Verificar CLI, shell e destino local exclusivo
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          bash -n scripts/p0-v1-synthetic-data-restore.sh
          test -f supabase/config.toml
      - name: Executar backup e restore local com instancias sequenciais e dados ficticios
        shell: bash
        run: bash scripts/p0-v1-synthetic-data-restore.sh
      - name: Arquivar apenas provas sanitizadas, jamais o arquivo dump
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contaos-p0-v1-synthetic-data-restore
          path: restore-proof-synthetic/
          if-no-files-found: warn
          retention-days: 30

