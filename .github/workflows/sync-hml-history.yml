name: Verificar histórico HML

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/applied-history/**'
      - 'supabase/scripts/materialize-migrations.mjs'
      - '.github/workflows/sync-hml-history.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/applied-history/**'
      - 'supabase/scripts/materialize-migrations.mjs'
      - '.github/workflows/sync-hml-history.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Materializar checkpoint e detectar drift
        run: |
          node supabase/scripts/materialize-migrations.mjs
          git diff --exit-code -- supabase/migrations
      - name: Garantir ausência de URL assinada/token hardcoded
        shell: bash
        run: |
          if git grep -nE 'storage/v1/object/sign/.+token=' -- '.github/**' ':!.github/workflows/sync-hml-history.yml'; then
            echo 'URL assinada hardcoded detectada em workflow.'
            exit 1
          fi
          echo 'Histórico HML sem token temporário hardcoded.'
