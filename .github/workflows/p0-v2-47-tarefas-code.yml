name: ContaOS V2 47 Tarefas CODE

on:
  pull_request:
    paths:
      - ".github/workflows/p0-v2-47-tarefas-code.yml"
      - "supabase/migrations/20261127050308_p0_v2_47_tarefa_vinculo_revalidacao.sql"
      - "supabase/functions/queue-worker-ai/**"
      - "supabase/tests/v2_47*"
      - "supabase/tests/history_catalog_compare.py"
      - "supabase/tests/v2_i05_worker.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/p0-v2-47-tarefas-code.yml"
      - "supabase/migrations/20261127050308_p0_v2_47_tarefa_vinculo_revalidacao.sql"
      - "supabase/functions/queue-worker-ai/**"
      - "supabase/tests/v2_47*"
      - "supabase/tests/history_catalog_compare.py"
      - "supabase/tests/v2_i05_worker.test.mjs"

permissions:
  contents: read

jobs:
  codigo:
    defaults:
      run:
        shell: bash
    name: V2 47 | PostgreSQL isolado
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: contaos_v247_fixture
          POSTGRES_PASSWORD: fixture-only-v247
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contaos_v247_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: contaos_v247_fixture
      PGUSER: postgres
      PGPASSWORD: fixture-only-v247
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Preparar organizações, rodadas e papéis sintéticos
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/v2_47_tarefas_fixture.sql
      - name: Aplicar a migração candidata ao PostgreSQL descartável
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261127050308_p0_v2_47_tarefa_vinculo_revalidacao.sql
      - name: Executar provas transacionais e concorrentes
        run: |
          mkdir -p provas-v2-47
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/v2_47_tarefas.test.sql | tee provas-v2-47/postgres.log
          python3 supabase/tests/v2_47_tarefas_concorrencia.py | tee provas-v2-47/concorrencia.log
      - name: Executar a revalidação, a regressão I05 e os controles de catálogo
        run: |
          node --test supabase/tests/v2_47_worker.test.mjs supabase/tests/v2_i05_worker.test.mjs supabase/tests/v2_47_catalog.test.mjs | tee provas-v2-47/node.tap
      - name: Vincular o artefato à tentativa, aos fontes e à árvore testada
        run: |
          git rev-parse HEAD HEAD^{tree} > provas-v2-47/checkout.txt
          printf '%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" > provas-v2-47/proveniencia.txt
          sha256sum supabase/migrations/20261127050308_p0_v2_47_tarefa_vinculo_revalidacao.sql \
            supabase/tests/v2_47_catalog_pins.json supabase/functions/queue-worker-ai/* > provas-v2-47/FONTES-SHA256SUMS
          (cd provas-v2-47 && sha256sum ./* > ../SHA256SUMS-v2-47)
          mv SHA256SUMS-v2-47 provas-v2-47/SHA256SUMS
      - name: Preservar o artefato material
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-47-backend-code
          path: provas-v2-47/
          if-no-files-found: error
