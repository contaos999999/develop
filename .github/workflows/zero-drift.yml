name: ContaOS Zero-Drift

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Arquivos alterados
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed.txt
          else
            git diff --name-only HEAD~1..HEAD > /tmp/changed.txt
          fi
          {
            echo 'ZERO_DRIFT_CHANGED_FILES<<EOF'
            cat /tmp/changed.txt
            echo EOF
          } >> "$GITHUB_ENV"
      - name: Context Gate — leitura obrigatória 4.1
        run: node scripts/ai-context-gate.mjs
      - name: Zero-Drift
        run: node scripts/zero-drift-check.mjs
      - name: Architecture Guard
        run: node scripts/architecture-guard.mjs
      - name: SQL Security Guard
        run: node scripts/sql-security-guard.mjs
      - name: Download Filename Security
        run: node scripts/security-download-filename-check.mjs
      - name: Webhook SSRF Security
        run: node scripts/security-webhook-ssrf-check.mjs
      - name: Browser Surface Security
        run: node scripts/security-browser-surface-check.mjs
      - name: Embeddings Worker Security
        run: node scripts/security-embeddings-worker-check.mjs
      - name: Migrations reproduzíveis
        run: |
          node supabase/scripts/materialize-migrations.mjs
          git diff --exit-code -- supabase/migrations
      - name: Segredos proibidos
        shell: bash
        run: |
          if git grep -nE 'sb_service_role_[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{20,}' -- ':!*.md' ':!.env.example' ':!scripts/architecture-guard.mjs' ':!.github/workflows/zero-drift.yml'; then
            echo 'Padrão de segredo detectado.'
            exit 1
          fi
          echo 'Scan de secrets PASS.'
