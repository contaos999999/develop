name: ContaOS V2 48 Contestação CODE

on:
  pull_request:
    paths:
      - ".github/workflows/p0-v2-48-contestacao-code.yml"
      - "supabase/migrations/20261127105223_p0_v2_48_contestacao_evidencia.sql"
      - "supabase/functions/queue-worker-ai/**"
      - "supabase/tests/v2_48*"
      - "supabase/tests/history_catalog_compare.py"
      - "supabase/tests/v2_i05_worker.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/p0-v2-48-contestacao-code.yml"
      - "supabase/migrations/20261127105223_p0_v2_48_contestacao_evidencia.sql"
      - "supabase/functions/queue-worker-ai/**"
      - "supabase/tests/v2_48*"
      - "supabase/tests/history_catalog_compare.py"
      - "supabase/tests/v2_i05_worker.test.mjs"

permissions:
  contents: read

jobs:
  codigo:
    defaults:
      run:
        shell: bash
    name: V2 48 | PostgreSQL isolado
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: contaos_v248_fixture
          POSTGRES_PASSWORD: fixture-only-v248
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contaos_v248_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: contaos_v248_fixture
      PGUSER: postgres
      PGPASSWORD: fixture-only-v248
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verificar as operações de âmbito e versão
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/v2_48_contestacao.test.sql
