name: ContaOS V2 48 Contestação CODE

on:
  pull_request:
    paths:
      - ".github/workflows/p0-v2-48-contestacao-code.yml"
      - "supabase/migrations/20261127105223_p0_v2_48_contestacao_evidencia.sql"
      - "supabase/functions/queue-worker-ai/**"
      - "supabase/tests/v2_48*"
      - "supabase/tests/history_catalog_compare.py"
      - "supabase/tests/v2_i05_worker.test.mjs"
      - "supabase/tests/v2_47_worker.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/p0-v2-48-contestacao-code.yml"
      - "supabase/migrations/20261127105223_p0_v2_48_contestacao_evidencia.sql"
      - "supabase/functions/queue-worker-ai/**"
      - "supabase/tests/v2_48*"
      - "supabase/tests/history_catalog_compare.py"
      - "supabase/tests/v2_i05_worker.test.mjs"
      - "supabase/tests/v2_47_worker.test.mjs"

permissions:
  contents: read

jobs:
  codigo:
    defaults:
      run:
        shell: bash
    name: V2 48 | PostgreSQL isolado
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: contaos_v248_fixture
          POSTGRES_PASSWORD: fixture-only-v248
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contaos_v248_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: contaos_v248_fixture
      PGUSER: postgres
      PGPASSWORD: fixture-only-v248
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Restaurar o escopo sintético e aplicar as migrações versionadas
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/v2_47_tarefas_fixture.sql \
            -f supabase/migrations/20261127050308_p0_v2_47_tarefa_vinculo_revalidacao.sql \
            -f supabase/tests/v2_48_contestacao_fixture.sql \
            -f supabase/migrations/20261127105223_p0_v2_48_contestacao_evidencia.sql
      - name: Provar versão, escopo, mapa, decisão e concorrência
        run: |
          mkdir -p provas-v2-48
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/v2_48_contestacao.test.sql | tee provas-v2-48/postgres.log
          python3 supabase/tests/v2_48_contestacao_concorrencia.py | tee provas-v2-48/concorrencia.log
      - name: Provar catálogo e worker com as regressões I05 e V2 47
        run: |
          node --test supabase/tests/v2_48_{worker,catalog}.test.mjs \
            supabase/tests/v2_47_worker.test.mjs supabase/tests/v2_i05_worker.test.mjs | tee provas-v2-48/node.tap
      - name: Registrar origem e selar o artefato
        run: |
          git rev-parse HEAD HEAD^{tree} > provas-v2-48/checkout.txt
          printf '%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" > provas-v2-48/proveniencia.txt
          sha256sum supabase/migrations/20261127105223_p0_v2_48_contestacao_evidencia.sql \
            supabase/tests/v2_48_catalog_pins.json supabase/functions/queue-worker-ai/* > provas-v2-48/FONTES-SHA256SUMS
          (cd provas-v2-48 && sha256sum ./* > ../SHA256SUMS-v2-48)
          mv SHA256SUMS-v2-48 provas-v2-48/SHA256SUMS
      - name: Preservar o artefato do regular 48
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-48-backend-code
          path: provas-v2-48/
          if-no-files-found: error
