name: P0 V2 77 migration CLI generator (offline)
on:
  pull_request:
    paths:
      - '.github/workflows/p0-v2-77-cli-generate.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate isolated migration with pinned CLI
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.81.3 --version
          npx --yes supabase@2.81.3 migration new --help >/dev/null
          npx --yes supabase@2.81.3 migration new p0_v2_77_desfechos_linha_tempo
          find supabase/migrations -maxdepth 1 -name '*_p0_v2_77_desfechos_linha_tempo.sql' -type f -print | tee "$RUNNER_TEMP/generated-path.txt"
          test "$(wc -l < "$RUNNER_TEMP/generated-path.txt")" -eq 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-v2-77-cli-generated
          path: supabase/migrations/*_p0_v2_77_desfechos_linha_tempo.sql
          if-no-files-found: error
          retention-days: 7
