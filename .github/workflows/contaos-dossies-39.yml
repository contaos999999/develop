name: ContaOS Dossies 39
on:
  push:
    branches: [main]
    paths:
      - 'docs/prompts/evidencias_individuais/**'
      - 'docs/prompts/INDICE_EVIDENCIAS_INDIVIDUAIS_39_2026-11-03.json'
      - 'docs/prompts/PLANO_SANEAMENTO_39_PROMPTS_2026-11-03.json'
      - 'scripts/validar-evidencias-39.mjs'
      - '.github/workflows/contaos-dossies-39.yml'
  pull_request:
    paths:
      - 'docs/prompts/evidencias_individuais/**'
      - 'docs/prompts/INDICE_EVIDENCIAS_INDIVIDUAIS_39_2026-11-03.json'
      - 'docs/prompts/PLANO_SANEAMENTO_39_PROMPTS_2026-11-03.json'
      - 'scripts/validar-evidencias-39.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dossies:
    name: Integridade documental 39/39
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validar-evidencias-39.mjs
